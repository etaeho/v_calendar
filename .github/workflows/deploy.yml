name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 매월 1일 공휴일 데이터를 다시 받아 재배포 (임시공휴일 반영)
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # 구글 캘린더 공개 '대한민국의 휴일' 캘린더에서 최신 공휴일을 받는다 (API 키 불필요, 실패 시 저장된 파일 사용)
      - run: npm run holidays
      - run: npm run build
        env:
          # 프로젝트 페이지는 https://<user>.github.io/<repo>/ 로 서빙된다
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
